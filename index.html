<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:,">
    <link rel = "shortcut icon" href = "#">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src = "chart.min.js"></script>
    <title>Football App</title>
</head>
<body>
    <div id="authSection" class = "auth-container">
        <h2>Coach Login</h2>
        <input type = "email" id = "authEmail" placeholder = "Enter Email" required>
        <input type = "password" id = "authPassword" placeholder = "Enter Password" required>
        <div class = "auth-buttons">
            <button type = "button" id = "loginBtn">Login</button>
            <button type = "button" id = "signUpBtn">Sign Up</button>
            <button type = "button" id = "logoutBtn">Logout</button>
        </div>
        <p id="authMessage" style="color: red;"></p>
    </div>
    <nav class="tab-nav">
        <button type="button" class="tab-btn active" id="btnInput">Log Play</button>
        <button type="button" class="tab-btn" id="btnAnalytics">Analytics</button>
        <button type = "button" class="tab-btn" id="btnPlaybook">Playbook</button>
    </nav>
    <h1> Football App</h1>
    <div id="analyticsTab" class="tab-content">
        <div class = 'card'>
            <div class="dashboard">
                <div class="stat-box">
                    <h3>Total Plays</h3>
                    <p id="totalPlays">0</p>
                </div>
                <div class="stat-box">
                    <h3>Total Yards</h3>
                    <p id="totalYards">0</p>
                </div>
                <div class="stat-box">
                    <h3>Avg Yards</h3>
                    <p id="avgYards">0</p>
                </div>
            </div>
        </div>
        <div class = 'card'>
            <div class = "card-filter-bar">
                <h3>Situational Filters</h3>
                <div class = "form-grid">
                    <div>
                        <label for = "filter-quarter">Quarter</label>
                        <select id="filter-quarter">
                            <option value = "all">All Quarters</option>
                            <option value = "1">Q1</option>
                            <option value = "2">Q2</option>
                            <option value = "3">Q3</option>
                            <option value = "4">Q4</option>
                        </select>
                    </div>
                    <div>
                        <label for = "filter-down">Down</label>
                        <select id="filter-down">
                            <option value = "all">All Downs</option>
                            <option value = "1">1st</option>
                            <option value = "2">2nd</option>
                            <option value = "3">3rd</option>
                            <option value = "4">4th</option>
                        </select>
                    </div>
                    <div>
                        <label for = "filter-formation">Formation</label>
                        <select id = "filter-formation">
                            <option value = "all">All Formations</option>
                        </select>
                    </div>
                    <div>
                        <label for = "filter-front">Front</label>
                        <select id = "filter-front">
                            <option value = "all">All Fronts</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class = 'charts-container'>
                <div class = 'chart-box'>
                        <h3>Play Call Frequency</h3>
                        <canvas id = "schemeChart" ></canvas>
                </div>
                <div class = 'chart-box'>
                        <h3>Scheme Efficiency</h3>
                        <canvas id = "schemeEfficiencyChart"></canvas>
                </div>
            </div>
            <div id="playBreakDownContainer"></div>
        </div>
    </div>
    <div id="playbookTab" class="tab-content">
        <div class = 'card'>
            <h2>Playbook</h2>
            <button type="button" id="downloadTemplateButton" class="select-btns">Download CSV Template</button>
            <input type="file" id="csvFileInput" accept=".csv">
            <button type="button" id="importCsvButton" class="add-btn">Import CSV</button>
            <button type="button" id="exportGameLog" class="add-btn">Export Game Log</button>
            <button type="button" id="resetGameLog" class="delete-btn">Reset Game Log</button>
        </div>
        <div class="card">
            <!--Add Custom General Formation-->
            <label for="newFormationInput">Add Custom Formation:</label>
            <input type="text" id="newFormationInput" placeholder="e.g. Deuce Rt">
            <button type="button" id="addFormationButton" class="add-btn">Add Formation</button>
            <!--Add Custom Playcall-->
            <label for="newPlayInput">Add Custom Play:</label>
            <input type="text" id="newPlayInput" placeholder="e.g. Option">
            <button type="button" id="addPlayButton" class="add-btn">Add Play</button>
            <!--Add Custom Tag-->
            <label for="newTagInput">Add Custom Tag:</label>
            <input type="text" id="newTagInput" placeholder="e.g. Speed">
            <button type="button" id="addTagButton" class="add-btn">Add Tag</button>
            <!--Add Custom General Scheme-->
            <label for="newSchemeInput">Add Custom Scheme:</label>
            <input type="text" id="newSchemeInput" placeholder="e.g. Duo">
            <button type="button" id="addSchemeButton" class="add-btn">Add Scheme</button>
        </div>
    </div>
        <div id="inputTab" class="tab-content active">
        <form id="playForm" class="form-grid">
            <div class = 'card'>
                <label for="quarter"><h2>Quarter:</h2></label>
                <select id = "quarter" class = "select-btns">
                    <option value="1">Q1</option>
                    <option value="2">Q2</option>
                    <option value="3">Q3</option>
                    <option value="4">Q4</option>
                </select>
                <br><br>
                    <!--Dropdown for Down Selection-->
                    <label for="down"><h2>Down:</h2></label>
                    <select id="down" class="select-btns">
                        <option value="1">1st</option>
                        <option value="2">2nd</option>
                        <option value="3">3rd</option>
                        <option value="4">4th</option>
                    </select>
                <!--<br> is a line break-->
                <br><br>
                <!--Input for Distance-->
                <label for="distance"><h2>Distance to Go:</h2></label>
                <input type="number" id="distance" value="10" class="select-btns">
                <br><br>
                    <!--Field Position Selector-->
                    <label><h2>Field Position:</h2></label><br>
                    <div id="hashContainer">
                        <button type="button" class = 'select-btns' onclick="selectHash('Left')">Left</button>
                        <button type="button" class = 'select-btns' onclick="selectHash('Middle')">Middle</button>
                        <button type="button" class = 'select-btns' onclick="selectHash('Right')">Right</button>
                    </div>
                <br>
            </div>
            <div class = 'card'>
                    <label for="formationsContainer"><h2>Formation:</h2></label><br>
                    <div id="formationsContainer"></div>
                    <br>
            </div>
            <!-- Scheme Selection-->
            <div class = 'card'>
                    <label for="schemesContainer"><h2>Scheme:</h2></label><br>
                    <div id="schemesContainer"></div>
                    <br>
            </div>
            <!--Playcall Button-->
                <!--Populated by Playbook-->
                    <!--label for="playCall">Play Call:</label>-->
                    <!--Do not need for because it is not a single thing, it is multiple buttons-->
            <div class = 'card'>
                <label for="selectedPlay"><h2>Play Call:</h2></label><br>
                <div id="playbookContainer"></div>
                <input type="hidden" id="selectedPlay" value="" >
                <br>
            </div>
                <!--Tag Selection-->
                <div class = 'card'>
                <label><h2>Tags:</h2></label>
                <div id="tagsContainer"></div>
                <br>
            </div>
            <div class = 'card'>
                    <!--Front Selection-->
                    <label><h2>Front:</h2></label>
                    <div id="frontContainer">
                        <button type="button" class="select-btns" onclick="selectFront('Over')">Over</button>
                        <button type="button" class="select-btns" onclick="selectFront('Under')">Under</button>
                        <button type="button" class="select-btns" onclick="selectFront('Okie')">Okie</button>
                        <button type="button" class="select-btns" onclick="selectFront('Mint')">Mint</button>
                        <button type="button" class="select-btns" onclick="selectFront('Bear')">Bear</button>
                    </div>
                <br>
                    <!--Yards Gained/Loss Input-->
                    <label for="yardsGained"><h2>Yards Gained:</h2></label>
                    <input type="number" id="yardsGained" value="0" class="select-btns">
                    <br>
                    <div id="quickPlayBtns">
                        <button type="button" id="incomplete-btn" class="select-btns">Incomplete</button>
                        <button type="button" id="sack-btn" class="select-btns">Sack</button>
                        <button type="button" id="penalty-btn" class="select-btns">Penalty</button>
                    </div>
                    <br>
            </div>
            <!--Submit Button-->
            <button type="button" onclick="logPlay()" class="add-btn log-play-btn">Log Play</button>
        </form>
        </div>
        <script type = "module">
            console.log("firebase module loading...")
            import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
            import{
                getAuth,
                createUserWithEmailAndPassword,
                signInWithEmailAndPassword,
                signOut,
                onAuthStateChanged,
                deleteUser,
                updateProfile,
            } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
            import {
                initializeFirestore,
                persistentLocalCache,
                collection, 
                addDoc,
                onSnapshot, 
                query,
                where,
            } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
            const firebaseConfig = {
                apiKey: "AIzaSyDE1oJryM2qrCpi9aKd7v84hfh4uWF5sh0",
                authDomain: "football-analytics-app-37021.firebaseapp.com",
                projectId: "football-analytics-app-37021",
                storageBucket: "football-analytics-app-37021.firebasestorage.app",
                messagingSenderId: "114856979175",
                appId: "1:114856979175:web:f6adfde1eecace65a55042",
                measurementId: "G-8PZ72X51MC"
            };
            const app = initializeApp(firebaseConfig);
            const auth  = getAuth(app);
            window.db = initializeFirestore(app, {
                localCache: persistentLocalCache()
            });
            //Helper function to save plays to Firebase
            window.savePlayToCloud = async function (playData) {
                const user = auth.currentUser;
                if (!user){
                    alert("Please Sign in to save plays");
                    return;
                }
                playData.userId = user.uid;
                try{
                    await addDoc(collection(window.db, "plays"), playData);
                    console.log("Play Saved to cloud");
                } catch (error) {
                    console.error("Error saving play to cloud:", error);
                }
            };
            //Listen for Auth state change (Login/log out)
            let unsubscribeFromPlays = null;
            onAuthStateChanged(auth, (user) => {
                if (unsubscribeFromPlays) unsubscribeFromPlays();
                if (user) {
                    console.log("User is signed in:", user.email , "UID:", user.uid);
                    const q  = query(collection(window.db, "plays"), where("userId", "==", user.uid));
                    unsubscribeFromPlays = onSnapshot(q, (snapshot) => {
                        let cloudPlays = [];
                        snapshot.forEach((doc) => {
                            cloudPlays.push(doc.data());
                        });
                        console.log("Real-time Cloud Plays for User:", cloudPlays);
                        if (typeof window.onPlaysUpdated === "function") {
                            window.onPlaysUpdated(cloudPlays);
                        }
                    });
                } else {
                    console.log("User is signed out");
                    if (typeof window.onPlaysUpdated === "function") {
                        window.onPlaysUpdated([]);
                    }
                }
            });
            window.signUpUser = (email, password) => {
                return createUserWithEmailAndPassword(auth, email, password);
            };
            window.signInUser = (email, password) => {
                return signInWithEmailAndPassword(auth, email, password);
            };
            window.signOutUser = () => {
                return signOut(auth);
            };
        </script>
    <script type ="module" src="script.js"></script>
</body>
</html>
